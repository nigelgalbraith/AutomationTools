# Ubuntu Desktop 26.04.1 LTS Automated Installation
# Standard GNOME Desktop
#
# Default login credentials:
# Username: user
# Password: Welcome123!
# Hostname: ubuntu
#
# Users should change their password after installation.

autoinstall:
  version: 1

  # Ask which drive/partitions to install Ubuntu on
  interactive-sections:
    - storage

  # Language and region
  locale: en_NZ.UTF-8
  timezone: Pacific/Auckland

  # Keyboard
  keyboard:
    layout: us

  # Default user account
  identity:
    realname: User
    hostname: ubuntu
    username: user
    password: "$6$RYiJ7FA4UeJGxrSh$uvEHDhmG7gwLz4sRHhCJCiYCQjNjVn2Z9iTverQka33zOHoGx1zGvS/MdBLBLwCLAW0YjHQYKOwH9hcTtFx9B1"

  # Select installation drive manually
  storage:
    layout:
      name: direct

  # Applications
  packages:
    - vlc
    - firefox
    - libreoffice
    - gimp
    - pdfarranger
    - file-roller
    - gparted
    - timeshift
    - ufw
    - unattended-upgrades

  # Install security updates
  updates: security

  # Configure firewall and automatic updates
  late-commands:

    # Configure UFW firewall
    - curtin in-target --target=/target -- ufw default deny incoming
    - curtin in-target --target=/target -- ufw default allow outgoing
    - curtin in-target --target=/target -- ufw --force enable

    # Enable automatic security updates
    - curtin in-target --target=/target -- systemctl enable apt-daily.timer
    - curtin in-target --target=/target -- systemctl enable apt-daily-upgrade.timer

  # Restart after installation
  shutdown: reboot